# The Agent kind: what a user writes to get an agent. The operator turns it into real objects.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.platform.hacktx.dev
spec:
  group: platform.hacktx.dev
  scope: Namespaced
  names: {kind: Agent, plural: agents, singular: agent, shortNames: [ag]}
  versions:
    - name: v1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Model, type: string, jsonPath: .spec.model}
        - {name: Replicas, type: integer, jsonPath: .spec.replicas}
        - {name: Ready, type: integer, jsonPath: .status.readyReplicas}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [model, instructions]
              properties:
                model: {type: string, minLength: 1}
                instructions: {type: string, minLength: 1}
                tools:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      allow: {type: array, items: {type: string}}
                      approval:
                        type: object
                        additionalProperties: {type: string, enum: [auto, human, deny]}
                      # e.g. {transfer_money: 500}: a call whose "amount" argument is above this needs a human, even if it's auto
                      approvalAbove:
                        type: object
                        additionalProperties: {type: number, minimum: 0}
                talksTo: {type: array, items: {type: string}}
                replicas: {type: integer, minimum: 0, maximum: 5, default: 1}
                budget:
                  type: object
                  default: {}
                  properties:
                    tokensPerDay: {type: integer, minimum: 1, default: 2000000}
                    maxStepsPerRequest: {type: integer, minimum: 1, maximum: 50, default: 12}
                template: {type: string}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
