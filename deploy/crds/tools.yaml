# The Tool kind: one MCP server in the registry, with a permission class for each of its functions.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tools.platform.hacktx.dev
spec:
  group: platform.hacktx.dev
  scope: Namespaced
  names: {kind: Tool, plural: tools, singular: tool}
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - {name: URL, type: string, jsonPath: .spec.url}
        - {name: Description, type: string, jsonPath: .spec.description}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [url, secretRef, classes]
              properties:
                url: {type: string}
                secretRef: {type: string}
                description: {type: string}
                classes:
                  type: object
                  additionalProperties: {type: string, enum: [read, write, sensitive]}
                # Machines this tool can act on (the gpu-fleet tool's GPU nodes). Agents pick from these by name.
                nodes:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      gpu: {type: string}
                      provider: {type: string}
                      connected: {type: boolean}
